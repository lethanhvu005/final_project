{% extends "base.html" %} {% load static %} {% block slidercarousel %}
{%endblock %} {% block content %}
<style>
  .shop-search-menu {
    margin-bottom: 32px;
  }

  .shop-search-fields {
    display: grid;
    grid-template-columns: 1.2fr repeat(4, 1fr);
    gap: 3px;
  }

  .shop-search-control {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid #f7f7f0;
    border-radius: 0;
    outline: none;
    background-color: #f0f0e9;
    color: #696763;
    font-size: 13px;
  }

  .shop-search-control:focus {
    border-color: #fe980f;
  }

  .shop-search-button {
    min-width: 92px;
    margin-top: 9px;
    padding: 9px 20px;
    border: 0;
    border-radius: 0;
    background-color: #fe980f;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }

  .shop-search-button:hover,
  .shop-search-button:focus {
    background-color: #e8890d;
    color: #fff;
  }

  @media (max-width: 767px) {
    .shop-search-fields {
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .shop-search-button {
      width: 100%;
    }
  }
</style>

<form class="shop-search-menu">
  <div class="shop-search-fields">
    <input
      class="shop-search-control"
      type="text"
      id="name_menu"
      placeholder="Name"
      aria-label="Product name"
    />

    <select class="shop-search-control" id="price" aria-label="Choose price">
      <option value="">Choose price</option>
      <option value="1">$0 - $50</option>
      <option value="2">$50 - $100</option>
      <option value="3">$100 - $200</option>
      <option value="4">$200+</option>
    </select>

    <select class="shop-search-control" id="category" aria-label="Category">
      <option value="">-- Chọn danh mục --</option>
      <option value="sportswear">SPORTSWEAR</option>
      <option value="mens">MENS</option>
      <option value="womens">WOMENS</option>
      <option value="kids">KIDS</option>
      <option value="fashion">FASHION</option>
      <option value="households">HOUSEHOLDS</option>
      <option value="interiors">INTERIORS</option>
      <option value="clothing">CLOTHING</option>
      <option value="bags">BAGS</option>
      <option value="shoes">SHOES</option>
    </select>
    <select class="shop-search-control" id="brand" aria-label="Brand">
      <option value="">-- Chọn thương hiệu --</option>
      <option value="acne">ACNE</option>
      <option value="grune-erde">GRÜNE ERDE</option>
      <option value="albiro">ALBIRO</option>
      <option value="ronhill">RONHILL</option>
      <option value="oddmolly">ODDMOLLY</option>
      <option value="boudestijn">BOUDESTIJN</option>
      <option value="rosch-creative-culture">RÖSCH CREATIVE CULTURE</option>
    </select>
    <select class="shop-search-control" id="status" aria-label="Status">
      <option value="">Status</option>
      <option value="sale">Sale</option>
      <option value="normal">Normal</option>
    </select>
  </div>

  <button class="shop-search-button" type="submit">Search</button>
</form>

<h2 class="title text-center">Features Items</h2>
<div id="shop-product-list">{% include "product_list.html" %}</div>
<script>
  $(document).ready(function () {
    $(".product-overlay").click(function (e) {
      $addPrd = $(e.target).closest(".add-to-cart");
      if ($addPrd.length > 0) {
        e.preventDefault();
        let idPrd = $addPrd.data("id");
        $.ajax({
          type: "POST",
          url: "{% url 'shop:index' %}",
          data: {
            id: idPrd,
          },
          headers: {
            "X-CSRFToken": "{{ csrf_token }}",
          },
          success: function (data) {
            if (data.success) {
              $("#cart-count").text(data.count);
            } else {
              alert(data.error);
            }
          },
        });

        return;
      }
      let href = $(this).find(".detail").attr("href");
      if (href) {
        window.location.href = href;
      }
    });
    $(".shop-search-button").click(function (e) {
      e.preventDefault();
      $row = $(this).closest(".shop-search-menu");
      let price = $row.find("#price").val();
      let category = $row.find("#category").val();
      let brand = $row.find("#brand").val();
      let status = $row.find("#status").val();
      let name = $row.find("#name_menu").val();
      $.ajax({
        type: "POST",
        headers: {
          "X-CSRFToken": "{{csrf_token}}",
        },
        url: "{% url 'shop:search_advanced' %}",
        data: {
          price: price,
          category: category,
          brand: brand,
          status: status,
          name: name,
        },
        success: function (data) {
          if (data.success) {
            alert("tìm done");
            $("#shop-product-list").html(data.html);
          }
        },
      });
    });
    $("#sl2").on("slideStop", function (e) {
      e.preventDefault();
      let val = $(".tooltip-inner").text();
      let arr = val.split(":");
      let min = parseInt(arr[0]);
      let max = parseInt(arr[1]);
      $.ajax({
        type: "POST",
        headers: {
          "X-CSRFToken": "{{csrf_token}}",
        },
        data: {
          min: min,
          max: max,
        },
        url: "{% url 'shop:search_price'%}",
        success: function (data) {
          if (data.success) {
            $("#shop-product-list").html(data.html);
          }
        },
      });
    });
  });
</script>
{% endblock %}
