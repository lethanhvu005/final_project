{% block prd_list %} {% for product in products%}
<div class="col-sm-4">
  <div class="product-image-wrapper">
    <div class="single-products">
      <div class="productinfo text-center">
        <img src="/media/{{product.image.0}}" alt="" />
        <h2>${{product.price}}</h2>
        <p>{{product.name}}</p>

        <a href="#" class="btn btn-default add-to-cart"
          ><i class="fa fa-shopping-cart"></i>Add to cart</a
        >
      </div>
      <div class="product-overlay">
        <div class="overlay-content">
          <h2>${{product.price}}</h2>
          <a
            class="detail"
            href="{% url 'product:product_detail' product.id %} "
          ></a>
          <p>{{product.name}}</p>
          {% if user.is_authenticated %}
          <a
            href="#"
            class="btn btn-default add-to-cart"
            data-id="{{ product.id }}"
          >
            <i class="fa fa-shopping-cart"></i>
            Add to cart
          </a>
          {% else %}
          <a href="{% url 'users:LoginUser' %}" class="btn btn-default">
            <i class="fa fa-lock"></i>
            Đăng nhập thêm vào giỏ hàng
          </a>
          {% endif %}
        </div>
      </div>
    </div>
    <div class="choose">
      <ul class="nav nav-pills nav-justified">
        <li>
          <a href="#"><i class="fa fa-plus-square"></i>Add to wishlist</a>
        </li>
        <li>
          <a href="#"><i class="fa fa-plus-square"></i>Add to compare</a>
        </li>
      </ul>
    </div>
  </div>
</div>
{%endfor%} {%endblock%}
